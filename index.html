<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Registro de Usuario</title>
        <style>
            :root {
                --bg: #f4f7ff;
                --card: #ffffff;
                --primary: #4b6cb7;
                --primary-dark: #2c3e71;
                --text: #1f2a44;
                --muted: #6d7b98;
                --border: #dfe3ef;
                --radius: 18px;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: linear-gradient(180deg, #edf1ff 0%, #f7fbff 100%);
                color: var(--text);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            .container {
                width: min(520px, 100%);
                background: var(--card);
                border: 1px solid rgba(35, 61, 156, 0.12);
                border-radius: var(--radius);
                box-shadow: 0 24px 80px rgba(26, 43, 111, 0.08);
                padding: 34px 34px 28px;
            }

            .container h1 {
                font-size: 1.95rem;
                margin-bottom: 10px;
                letter-spacing: -0.03em;
            }

            .container p {
                margin-bottom: 28px;
                color: var(--muted);
                line-height: 1.7;
            }

            .form-grid {
                display: grid;
                gap: 18px;
            }

            label {
                font-size: 0.95rem;
                color: var(--text);
                margin-bottom: 8px;
                display: block;
                font-weight: 600;
            }

            input,
            select {
                width: 100%;
                border: 1px solid var(--border);
                background: #fff;
                border-radius: 14px;
                padding: 14px 16px;
                font-size: 0.98rem;
                color: var(--text);
                transition: border-color 0.2s ease, box-shadow 0.2s ease;
            }

            input:focus,
            select:focus {
                outline: none;
                border-color: var(--primary);
                box-shadow: 0 0 0 4px rgba(75, 108, 183, 0.12);
            }

            .two-columns {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 18px;
            }

            .checkbox-group {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-top: 8px;
            }

            .checkbox-group input {
                width: auto;
                margin: 0;
            }

            .checkbox-group label {
                margin: 0;
                font-weight: 500;
            }

            .button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                padding: 14px 18px;
                background: var(--primary);
                border: none;
                border-radius: 14px;
                color: #fff;
                font-size: 1rem;
                font-weight: 700;
                cursor: pointer;
                transition: transform 0.2s ease, filter 0.2s ease;
            }

            .button:hover {
                transform: translateY(-1px);
                filter: brightness(1.05);
            }

            .note {
                margin-top: 18px;
                color: var(--muted);
                font-size: 0.95rem;
                line-height: 1.6;
            }

            @media (max-width: 540px) {
                .two-columns {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>
    <body>
        <main class="container">
            <h1>Registro de Usuario</h1>
            <p>Completa tus datos para crear una cuenta nueva. Los campos marcados con * son obligatorios.</p>

            <form class="form-grid" action="#" method="post">
                <div>
                    <label for="nombre">Nombre completo *</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Juan Pérez" required />
                </div>

                <div>
                    <label for="email">Correo electrónico *</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required />
                </div>

                <div class="two-columns">
                    <div>
                        <label for="usuario">Nombre de usuario *</label>
                        <input type="text" id="usuario" name="usuario" placeholder="usuario123" required />
                    </div>
                    <div>
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="+34 600 123 456" />
                    </div>
                </div>

                <div class="two-columns">
                    <div>
                        <label for="contrasena">Contraseña *</label>
                        <input type="password" id="contrasena" name="contrasena" placeholder="Mínimo 8 caracteres" required />
                    </div>
                    <div>
                        <label for="confirmar">Confirmar contraseña *</label>
                        <input type="password" id="confirmar" name="confirmar" placeholder="Repite la contraseña" required />
                    </div>
                </div>

                <div>
                    <label for="pais">País</label>
                    <select id="pais" name="pais">
                        <option value="">Selecciona tu país</option>
                        <option value="es">España</option>
                        <option value="mx">México</option>
                        <option value="ar">Argentina</option>
                        <option value="cl">Chile</option>
                        <option value="co">Colombia</option>
                        <option value="other">Otro</option>
                    </select>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terminos" name="terminos" required />
                    <label for="terminos">Acepto los términos y condiciones *</label>
                </div>

                <button class="button" type="submit">Crear cuenta</button>
            </form>

            <p class="note">¿Ya tienes cuenta? <a href="#">Inicia sesión aquí</a>.</p>
        </main>
    </body>
</html>
